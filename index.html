<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Tracking - Jarot's Company Ultra Cycling</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #f8fafc; color: #0f172a; }
    header {
      background: #0f172a; color: #ffffff; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    header h1 { font-size: 15px; font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .role-tag {
      font-size: 11px; padding: 3px 8px; border-radius: 4px;
      background: #1e293b; color: #94a3b8; border: 1px solid #334155;
    }
    .badge {
      font-size: 12px; padding: 4px 10px; border-radius: 999px;
      background: #334155; color: #e2e8f0; font-weight: 600;
    }
    .badge.aktif { background: #16a34a; color: #ffffff; }
    .badge.bahaya { background: #dc2626; color: #ffffff; animation: kedip 1s infinite; }
    @keyframes kedip { 50% { opacity: 0.6; } }

    #alertBanner {
      display: none; background: #dc2626; color: #ffffff;
      padding: 10px 16px; font-size: 13px; font-weight: 600;
      justify-content: space-between; align-items: center; gap: 12px;
    }
    #alertBanner.tampil { display: flex; }

    #map { flex: 1; width: 100%; }

    .panel {
      background: #ffffff; border-top: 1px solid #e2e8f0; padding: 12px 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .panel-top {
      display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center;
    }
    .info-grid { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; }
    .info-item span { display: block; font-size: 11px; color: #64748b; text-transform: uppercase; }
    .info-item strong { font-size: 13px; color: #0f172a; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button, select, input {
      border: none; padding: 7px 11px; border-radius: 6px; font-size: 12px;
    }
    button {
      background: #0f172a; color: #ffffff; font-weight: 500; cursor: pointer;
    }
    button.secondary, select { background: #e2e8f0; color: #0f172a; font-weight: 500; }
    button.alarm-on { background: #b91c1c; color: #ffffff; }
    input {
      border: 1px solid #cbd5e1; background: #f8fafc; color: #0f172a; width: 115px; font-weight: 600;
    }

    #adminBar {
      display: none; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 10px; padding-top: 8px; border-top: 1px dashed #cbd5e1; font-size: 12px;
    }
    #adminBar label { color: #334155; font-weight: 500; }
    #logStatus { color: #475569; font-style: italic; }
  </style>
</head>
<body>

  <header>
    <h1>Ultra-Cycling Live Tracker</h1>
    <div class="header-right">
      <span id="roleTag" class="role-tag">Penonton (Read-Only)</span>
      <div id="statusBadge" class="badge">Memuat data...</div>
    </div>
  </header>

  <div id="alertBanner">
    <span id="alertText">PERINGATAN ADMIN: Peserta Jarots0001 keluar dari jalur rute GPX!</span>
    <button class="secondary" onclick="fokusKePeserta()">Lihat Posisi</button>
  </div>

  <div id="map"></div>

  <div class="panel">
    <div class="panel-top">
      <div class="info-grid">
        <div class="info-item">
          <span>ID Peserta</span>
          <strong id="pesertaIdText">Jarots0001</strong>
        </div>
        <div class="info-item">
          <span>Status</span>
          <strong id="statusText">Menunggu GPS</strong>
        </div>
        <div class="info-item" id="deviasiBox" style="display:none;">
          <span>Deviasi dari GPX</span>
          <strong id="deviasiText">-</strong>
        </div>
        <div class="info-item">
          <span>Koordinat</span>
          <strong id="coordText">-</strong>
        </div>
        <div class="info-item">
          <span>Update Terakhir</span>
          <strong id="timeText">-</strong>
        </div>
      </div>

      <div class="btn-group">
        <button onclick="fokusKePeserta()">Fokus Peserta</button>
        <button class="secondary" onclick="lihatSemuaRute()">Lihat Rute GPX</button>
      </div>
    </div>

    <div id="adminBar">
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        <label for="inputIdPeserta">ID:</label>
        <input type="text" id="inputIdPeserta" value="Jarots0001" />
        <button class="secondary" onclick="simpanIdPeserta()">Set ID</button>

        <label for="batasSelect">Toleransi:</label>
        <select id="batasSelect" onchange="ambilDataThingSpeak()">
          <option value="30">30 m</option>
          <option value="50" selected>50 m</option>
          <option value="100">100 m</option>
          <option value="200">200 m</option>
        </select>

        <button id="btnAlarm" class="secondary" onclick="toggleAlarm()">Alarm: MATI</button>
        <button onclick="mulaiSesiBaru()">Mulai Sesi Baru (Reset Jejak)</button>
        <button class="secondary" onclick="tampilkanSemuaData()">Semua Data</button>
      </div>
      <div id="logStatus">Log Admin: Belum ada pelanggaran jalur.</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const CHANNEL_ID   = '3595644';
    const READ_API_KEY = '9A61I7SERV3XC4W0';
    const GPX_FILE     = 'rute_purwokerto.gpx';

    const params  = new URLSearchParams(window.location.search);
    const isAdmin = params.get('role') === 'admin';

    let pesertaId = params.get('id') || localStorage.getItem('jarots_peserta_id') || 'Jarots0001';
    let sessionStartMs = parseInt(localStorage.getItem('jarots_session_start') || '0', 10);

    document.getElementById('pesertaIdText').textContent = pesertaId;
    document.getElementById('inputIdPeserta').value = pesertaId;

    if (isAdmin) {
      document.getElementById('roleTag').textContent = 'Admin Panitia';
      document.getElementById('adminBar').style.display = 'flex';
      document.getElementById('deviasiBox').style.display = 'block';
    }

    const map = L.map('map').setView([-7.4062, 109.2607], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let gpxCoords = [];
    let gpxLayer = null;
    let riderMarker = null;
    let snappedTrailLine = null;
    let offTrackTrailLine = null;
    let offTrackGuideLine = null;
    let lastLatLng = null;
    let pertamaKaliFokus = true;
    let alarmAktif = false;

    function buatIsiPopup(lat, lng, waktu, mode) {
      return `<b>ID Peserta: ${pesertaId}</b><br>` +
             `Mode Jalur: ${mode}<br>` +
             `Koordinat: ${lat.toFixed(6)}, ${lng.toFixed(6)}<br>` +
             `Update: ${waktu}`;
    }

    function simpanIdPeserta() {
      const nilaiBaru = document.getElementById('inputIdPeserta').value.trim();
      if (!nilaiBaru) return;
      pesertaId = nilaiBaru;
      localStorage.setItem('jarots_peserta_id', pesertaId);
      document.getElementById('pesertaIdText').textContent = pesertaId;
      ambilDataThingSpeak();
    }

    function mulaiSesiBaru() {
      sessionStartMs = Date.now();
      localStorage.setItem('jarots_session_start', String(sessionStartMs));
      document.getElementById('logStatus').textContent = 'Sesi baru dimulai. Menunggu titik GPS terbaru...';
      ambilDataThingSpeak();
    }

    function tampilkanSemuaData() {
      sessionStartMs = 0;
      localStorage.setItem('jarots_session_start', '0');
      document.getElementById('logStatus').textContent = 'Menampilkan seluruh riwayat data hari ini.';
      ambilDataThingSpeak();
    }

    function bunyikanBeep() {
      if (!isAdmin || !alarmAktif) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    }

    function toggleAlarm() {
      alarmAktif = !alarmAktif;
      const btn = document.getElementById('btnAlarm');
      if (alarmAktif) {
        btn.textContent = 'Alarm: AKTIF';
        btn.className = 'alarm-on';
        bunyikanBeep();
      } else {
        btn.textContent = 'Alarm: MATI';
        btn.className = 'secondary';
      }
    }

    // Proyeksi bertahap agar rute melingkar (loop) tidak meloncat langsung ke Finish
    function proyeksikanKeRute(lat, lon, rute, maxSegSaatIni) {
      const totalSeg = rute.length - 1;
      if (totalSeg < 1) return { jarak: 0, titikTerdekat: [lat, lon], segIndex: 0 };

      const R = 6371000;
      const rad = Math.PI / 180;
      const cosLat = Math.cos(lat * rad);

      const batasAwal = Math.max(0, maxSegSaatIni);
      let batasAkhir = Math.min(totalSeg - 1, maxSegSaatIni + 2);

      // Kunci 2 segmen terakhir (Finish) sebelum peserta melewati 70% putaran rute
      if (totalSeg >= 4 && maxSegSaatIni < Math.floor(totalSeg * 0.7)) {
        batasAkhir = Math.min(batasAkhir, totalSeg - 3);
      }
      if (batasAkhir < batasAwal) batasAkhir = batasAwal;

      let minJarak = Infinity;
      let titikTerdekat = rute[batasAwal];
      let bestSegIndex = batasAwal;

      for (let i = batasAwal; i <= batasAkhir; i++) {
        const [lat1, lon1] = rute[i];
        const [lat2, lon2] = rute[i + 1];

        const x1 = (lon1 - lon) * rad * R * cosLat;
        const y1 = (lat1 - lat) * rad * R;
        const x2 = (lon2 - lon) * rad * R * cosLat;
        const y2 = (lat2 - lat) * rad * R;

        const dx = x2 - x1;
        const dy = y2 - y1;
        const lenSq = dx * dx + dy * dy;

        let t = 0;
        if (lenSq > 0) {
          t = -(x1 * dx + y1 * dy) / lenSq;
          t = Math.max(0, Math.min(1, t));
        }

        const xc = x1 + t * dx;
        const yc = y1 + t * dy;
        const d = Math.sqrt(xc * xc + yc * yc);

        if (d < minJarak) {
          minJarak = d;
          titikTerdekat = [lat1 + t * (lat2 - lat1), lon1 + t * (lon2 - lon1)];
          bestSegIndex = i;
        }
      }

      return { jarak: minJarak, titikTerdekat, segIndex: bestSegIndex };
    }

    async function muatRuteGPX() {
      try {
        const res = await fetch(GPX_FILE + '?v=' + Date.now());
        const xmlText = await res.text();
        const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
        const trkpts = xml.querySelectorAll('trkpt');

        gpxCoords = [];
        trkpts.forEach(pt => {
          const lat = parseFloat(pt.getAttribute('lat'));
          const lon = parseFloat(pt.getAttribute('lon'));
          if (!isNaN(lat) && !isNaN(lon)) gpxCoords.push([lat, lon]);
        });

        if (gpxCoords.length > 0) {
          gpxLayer = L.polyline(gpxCoords, {
            color: '#2563eb',
            weight: 5,
            opacity: 0.45
          }).addTo(map);

          L.circleMarker(gpxCoords[0], {
            radius: 7, color: '#15803d', fillColor: '#22c55e', fillOpacity: 1
          }).addTo(map).bindPopup('<b>START / FINISH</b>');

          map.fitBounds(gpxLayer.getBounds(), { padding: [30, 30] });
        }
      } catch (err) {
        console.error('Gagal memuat GPX:', err);
      }
    }

    async function ambilDataThingSpeak() {
      const url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?api_key=${READ_API_KEY}&days=1&results=8000`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const feeds = data.feeds || [];

        const batasMeter = parseFloat(document.getElementById('batasSelect').value);
        const rawPoints = [];

        feeds.forEach(f => {
          const lat = parseFloat(f.field1);
          const lng = parseFloat(f.field2);
          const ts  = new Date(f.created_at).getTime();
          if (!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0 && ts >= sessionStartMs) {
            rawPoints.push({ lat, lng, time: f.created_at });
          }
        });

        const badge = document.getElementById('statusBadge');
        if (rawPoints.length === 0) {
          badge.textContent = 'Menunggu data baru...';
          badge.className = 'badge';
          document.getElementById('statusText').textContent = 'Menunggu GPS';
          if (snappedTrailLine) snappedTrailLine.setLatLngs([]);
          if (offTrackTrailLine) offTrackTrailLine.setLatLngs([]);
          return;
        }

        let maxSegIndex = 0;
        let lastSnappedPoint = gpxCoords.length > 0 ? gpxCoords[0] : null;
        let pergerakanTerdeteksi = false;
        let offTrackSegments = [];
        let sedangOffTrack = false;
        let hasilTerakhir = null;

        rawPoints.forEach((pt, idx) => {
          if (gpxCoords.length > 1) {
            const cek = proyeksikanKeRute(pt.lat, pt.lng, gpxCoords, maxSegIndex);

            if (cek.jarak <= batasMeter) {
              pergerakanTerdeteksi = true;
              if (cek.segIndex >= maxSegIndex) {
                maxSegIndex = cek.segIndex;
                lastSnappedPoint = cek.titikTerdekat;
              }
              sedangOffTrack = false;
            } else {
              // Hanya gambar segmen merah antar titik di luar jalur (tanpa jembatan diagonal ke rute)
              if (!sedangOffTrack) {
                offTrackSegments.push([[pt.lat, pt.lng]]);
                sedangOffTrack = true;
              } else {
                offTrackSegments[offTrackSegments.length - 1].push([pt.lat, pt.lng]);
              }
            }

            if (idx === rawPoints.length - 1) {
              hasilTerakhir = cek;
            }
          }
        });

        const jejakRapiGPX = [];
        if (gpxCoords.length > 1 && pergerakanTerdeteksi && lastSnappedPoint) {
          for (let i = 0; i <= maxSegIndex; i++) {
            jejakRapiGPX.push(gpxCoords[i]);
          }
          jejakRapiGPX.push(lastSnappedPoint);
        }

        const terbaru = rawPoints[rawPoints.length - 1];
        const jarakMeter = hasilTerakhir ? Math.round(hasilTerakhir.jarak) : 0;
        const keluarJalur = (gpxCoords.length > 1 && jarakMeter > batasMeter);

        const posisiMarker = (!keluarJalur && lastSnappedPoint) ? lastSnappedPoint : [terbaru.lat, terbaru.lng];
        lastLatLng = posisiMarker;

        document.getElementById('coordText').textContent =
          `${terbaru.lat.toFixed(6)}, ${terbaru.lng.toFixed(6)}`;

        const waktuWIB = new Date(terbaru.time).toLocaleString('id-ID', {
          timeZone: 'Asia/Jakarta',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        }) + ' WIB';
        document.getElementById('timeText').textContent = waktuWIB;
        document.getElementById('deviasiText').textContent = `${jarakMeter} meter`;

        if (snappedTrailLine) {
          snappedTrailLine.setLatLngs(jejakRapiGPX);
        } else {
          snappedTrailLine = L.polyline(jejakRapiGPX, {
            color: '#16a34a',
            weight: 5,
            opacity: 0.95
          }).addTo(map);
        }

        if (offTrackTrailLine) {
          offTrackTrailLine.setLatLngs(offTrackSegments);
        } else {
          offTrackTrailLine = L.polyline(offTrackSegments, {
            color: '#dc2626',
            weight: 4
          }).addTo(map);
        }

        const banner = document.getElementById('alertBanner');
        if (keluarJalur) {
          document.getElementById('statusText').textContent = 'Keluar Jalur';
          if (isAdmin) {
            badge.textContent = `KELUAR JALUR (${jarakMeter}m)`;
            badge.className = 'badge bahaya';
            banner.classList.add('tampil');
            document.getElementById('alertText').textContent =
              `PERINGATAN ADMIN: Peserta ${pesertaId} keluar jalur sejauh ${jarakMeter} meter (batas ${batasMeter}m)!`;
            document.getElementById('logStatus').textContent =
              `[${pesertaId}] Keluar jalur pukul ${waktuWIB} (${jarakMeter}m dari rute).`;

            if (hasilTerakhir && hasilTerakhir.titikTerdekat) {
              if (offTrackGuideLine) {
                offTrackGuideLine.setLatLngs([posisiMarker, hasilTerakhir.titikTerdekat]);
              } else {
                offTrackGuideLine = L.polyline([posisiMarker, hasilTerakhir.titikTerdekat], {
                  color: '#dc2626', weight: 2, dashArray: '6, 6'
                }).addTo(map);
              }
            }
            bunyikanBeep();
          } else {
            badge.textContent = 'Live Aktif';
            badge.className = 'badge aktif';
          }
        } else {
          document.getElementById('statusText').textContent = 'Sesuai Rute GPX';
          badge.textContent = isAdmin ? 'Dalam Jalur (Aman)' : 'Live Aktif';
          badge.className = 'badge aktif';
          banner.classList.remove('tampil');
          if (offTrackGuideLine) {
            map.removeLayer(offTrackGuideLine);
            offTrackGuideLine = null;
          }
        }

        const modeTeks = keluarJalur ? `Keluar Jalur (${jarakMeter}m)` : 'Sesuai Rute GPX';
        const isiPopup = buatIsiPopup(terbaru.lat, terbaru.lng, waktuWIB, modeTeks);
        if (riderMarker) {
          riderMarker.setLatLng(posisiMarker);
          riderMarker.setPopupContent(isiPopup);
        } else {
          riderMarker = L.circleMarker(posisiMarker, {
            radius: 9, color: '#ffffff', weight: 3,
            fillColor: '#dc2626', fillOpacity: 1
          }).addTo(map).bindPopup(isiPopup);
        }

        if (pertamaKaliFokus) {
          map.setView(posisiMarker, 16);
          pertamaKaliFokus = false;
        }
      } catch (err) {
        console.error('Gagal mengambil data ThingSpeak:', err);
      }
    }

    function fokusKePeserta() {
      if (lastLatLng) map.setView(lastLatLng, 16);
    }

    function lihatSemuaRute() {
      if (gpxLayer) map.fitBounds(gpxLayer.getBounds(), { padding: [30, 30] });
    }

    async function mulaiAplikasi() {
      await muatRuteGPX();
      await ambilDataThingSpeak();
      setInterval(ambilDataThingSpeak, 10000);
    }

    mulaiAplikasi();
  </script>
</body>
</html>
